<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button></ion-back-button></ion-buttons>
    <ion-title>Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="vits-page vits-stack">

    <div class="vits-card vits-stack vits-center-text">
      <div class="vits-logo"><ion-icon name="person-outline"></ion-icon></div>
      <h2 class="vits-heading">{{ session.userName }}</h2>
      <div><span class="vits-chip info">{{ session.role === 'OIC' ? 'Officer-in-Charge' : 'Student' }}</span></div>
    </div>

    <div class="vits-card vits-stack">
      <strong>Developer panel (mock)</strong>
      <ion-toggle [checked]="session.offline" (ionChange)="toggleOffline($event)">Simulate offline</ion-toggle>
      <div class="vits-muted">Pending sync: {{ session.pendingSync }}</div>
      <ion-button size="small" fill="outline" color="warning" (click)="expireSession()">Simulate session expiry</ion-button>
    </div>

    <ion-button expand="block" color="danger" fill="outline" (click)="signOut()">
      <ion-icon slot="start" name="log-out-outline"></ion-icon> Sign out
    </ion-button>
  </div>
</ion-content>
