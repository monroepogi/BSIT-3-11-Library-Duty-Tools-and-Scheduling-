<ion-content [fullscreen]="true">
  <div class="vits-page vits-stack vits-center">
    <img class="vits-logo-img" src="vits-logo.png" alt="VITS Library Scheduling System" />
    <h1 class="vits-heading">VITS</h1>
    <p class="vits-muted">Library duty scheduling and attendance</p>

    @if (auth.sessionMessage()) {
      <div class="vits-banner offline" role="status">{{ auth.sessionMessage() }}</div>
    }

    @if (error()) {
      <div class="vits-banner bad" role="alert">{{ error() }}</div>
    }

    <ion-input
      label="University Email"
      label-placement="floating"
      fill="outline"
      type="email"
      [(ngModel)]="email"
      placeholder="student@university.edu"
    ></ion-input>

    <ion-input
      label="Password"
      label-placement="floating"
      fill="outline"
      type="password"
      [(ngModel)]="password"
      (keyup.enter)="signIn()"
    ></ion-input>

    <ion-button expand="block" size="large" [disabled]="loading() || !email.trim() || !password" (click)="signIn()">
      <ion-icon slot="start" name="shield-checkmark-outline"></ion-icon>
      {{ loading() ? 'Signing in...' : 'Sign in' }}
    </ion-button>
  </div>
</ion-content>
