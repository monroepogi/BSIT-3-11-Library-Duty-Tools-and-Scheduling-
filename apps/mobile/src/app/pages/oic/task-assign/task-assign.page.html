<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/oic/tasks"></ion-back-button></ion-buttons>
    <ion-title>Assign Task</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="vits-page vits-stack">
    <ion-select label="Student Shift" label-placement="floating" fill="outline" placeholder="Choose a rostered shift" [(ngModel)]="selectedShiftId">
      @for (s of rosteredShifts(); track s.id) {
        <ion-select-option [value]="s.id">{{ s.userFullName }} ({{ s.sectionName }})</ion-select-option>
      }
    </ion-select>

    <ion-select label="Task type" label-placement="floating" fill="outline" [(ngModel)]="category">
      <ion-select-option value="shelving">Shelving</ion-select-option>
      <ion-select-option value="circulation">Circulation</ion-select-option>
      <ion-select-option value="inventory">Inventory</ion-select-option>
      <ion-select-option value="desk_support">Desk support</ion-select-option>
    </ion-select>

    <ion-input label="Task description" label-placement="floating" fill="outline" [(ngModel)]="title"></ion-input>

    <ion-button expand="block" [disabled]="!selectedShiftId || !title.trim()" (click)="assign()">Assign task</ion-button>
  </div>
</ion-content>
